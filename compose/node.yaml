services:
  node:
    extends:
      file: ./base.yaml
      service: base
    image: "${NODE_IMAGE:-\
      ${NODE_REPOSITORY:-node}\
      :${NODE_TAG:?Set `NODE_TAG` and `NODE_IMAGE_DIGEST`, or `NODE_IMAGE`.}\
      @${NODE_IMAGE_DIGEST:?Set `NODE_TAG` and `NODE_IMAGE_DIGEST`, or `NODE_IMAGE`.}}"
    profiles:
      - node
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    mem_limit: ${NODE_CONTAINER_MEMORY_LIMIT:-2g}
    pids_limit: ${NODE_CONTAINER_PIDS_LIMIT:-256}
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:rw
