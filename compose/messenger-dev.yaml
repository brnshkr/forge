services:
  messenger:
    image: ${FORGE_APP_IMAGE:-${FORGE_REPOSITORY_OWNER:?Set it to the namespace of Forge's images, e.g. `ghcr.io/brnshkr`.}/${FORGE_APP_IMAGE_NAME:-forge-app}:${FORGE_TAG:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}${FORGE_APP_IMAGE_SUFFIX:-}@${FORGE_APP_IMAGE_DIGEST:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}}
    command: >-
      bin/console messenger:consume ${MESSENGER_TRANSPORTS:?Set it to the transports to consume, e.g. `async scheduler_default`.}
        --time-limit=${MESSENGER_TIME_LIMIT:-3600}
        --memory-limit=${MESSENGER_MEMORY_LIMIT:-128M}
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    restart: unless-stopped
    logging:
      driver: local
    init: true
    read_only: true
    mem_limit: ${MESSENGER_DEV_CONTAINER_MEMORY_LIMIT:-${MESSENGER_CONTAINER_MEMORY_LIMIT:-512m}}
    pids_limit: ${MESSENGER_DEV_CONTAINER_PIDS_LIMIT:-${MESSENGER_CONTAINER_PIDS_LIMIT:-512}}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      LANG: ~
      LC_ALL: ~
      PHP_IDE_CONFIG: ~
      TZ: ~
      XDEBUG_CONFIG: ~
      XDEBUG_MODE: ~
      XDG_CACHE_HOME: /app/.cache/xdg.cache
      XDG_CONFIG_HOME: /app/.cache/xdg.cache
      XDG_DATA_HOME: /app/.cache/xdg.cache
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=32m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:rw
