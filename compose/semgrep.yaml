services:
  semgrep:
    extends:
      file: ./base.yaml
      service: base
    image: "${SEMGREP_IMAGE:-\
      ${SEMGREP_REPOSITORY:-semgrep/semgrep}\
      :${SEMGREP_TAG:?Set `SEMGREP_TAG` and `SEMGREP_IMAGE_DIGEST`, or `SEMGREP_IMAGE`.}\
      @${SEMGREP_IMAGE_DIGEST:?Set `SEMGREP_TAG` and `SEMGREP_IMAGE_DIGEST`, or `SEMGREP_IMAGE`.}}"
    profiles:
      - semgrep
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    mem_limit: ${SEMGREP_CONTAINER_MEMORY_LIMIT:-1g}
    pids_limit: ${SEMGREP_CONTAINER_PIDS_LIMIT:-256}
    environment:
      HOME: /tmp
      SEMGREP_SRC_DIRECTORY: /app
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:rw
