services:
  postgres:
    extends:
      file: ./base.yaml
      service: base
    image: "${POSTGRES_IMAGE:-\
      ${POSTGRES_REPOSITORY:-postgres}\
      :${POSTGRES_TAG:?Set `POSTGRES_TAG` and `POSTGRES_IMAGE_DIGEST`, or `POSTGRES_IMAGE`.}\
      @${POSTGRES_IMAGE_DIGEST:?Set `POSTGRES_TAG` and `POSTGRES_IMAGE_DIGEST`, or `POSTGRES_IMAGE`.}}"
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    user: postgres
    mem_limit: ${POSTGRES_CONTAINER_MEMORY_LIMIT:-1g}
    pids_limit: ${POSTGRES_CONTAINER_PIDS_LIMIT:-256}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /run:rw,nosuid,nodev,size=64m,mode=1777
    volumes:
      - forge-postgres-data:/var/lib/postgresql

volumes:
  forge-postgres-data: ~
