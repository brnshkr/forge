services:
  postgres:
    image: ${POSTGRES_IMAGE:-${POSTGRES_REPOSITORY:-postgres}:${POSTGRES_TAG:?Set `POSTGRES_TAG` and `POSTGRES_IMAGE_DIGEST`, or `POSTGRES_IMAGE`.}@${POSTGRES_IMAGE_DIGEST:?Set `POSTGRES_TAG` and `POSTGRES_IMAGE_DIGEST`, or `POSTGRES_IMAGE`.}}
    container_name: ${COMPOSE_PROJECT_NAME}-postgres
    user: postgres
    restart: unless-stopped
    logging:
      driver: local
    init: true
    read_only: true
    mem_limit: ${POSTGRES_CONTAINER_MEMORY_LIMIT:-1g}
    pids_limit: ${POSTGRES_CONTAINER_PIDS_LIMIT:-256}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /run:rw,nosuid,nodev,size=64m,mode=1777
    volumes:
      - forge-postgres-data:/var/lib/postgresql

volumes:
  forge-postgres-data: ~
