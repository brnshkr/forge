services:
  valkey:
    extends:
      file: ./base.yaml
      service: base
    image: "${VALKEY_IMAGE:-\
      ${VALKEY_REPOSITORY:-valkey/valkey}\
      :${VALKEY_TAG:?Set `VALKEY_TAG` and `VALKEY_IMAGE_DIGEST`, or `VALKEY_IMAGE`.}\
      @${VALKEY_IMAGE_DIGEST:?Set `VALKEY_TAG` and `VALKEY_IMAGE_DIGEST`, or `VALKEY_IMAGE`.}}"
    container_name: ${COMPOSE_PROJECT_NAME}-valkey
    command: >-
      valkey-server
      --maxmemory ${VALKEY_MAXMEMORY:-256mb}
      --maxmemory-policy ${VALKEY_MAXMEMORY_POLICY:-noeviction}
      --appendonly yes
      --appendfsync everysec
    user: valkey
    mem_limit: ${VALKEY_CONTAINER_MEMORY_LIMIT:-512m}
    pids_limit: ${VALKEY_CONTAINER_PIDS_LIMIT:-256}
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    volumes:
      - forge-valkey-data:/data

volumes:
  forge-valkey-data: ~
