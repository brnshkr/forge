services:
  php-app:
    extends:
      file: ./base.yaml
      service: base
    image: "${FORGE_APP_IMAGE:-\
      ${FORGE_IMAGE_NAMESPACE:-\
      ${FORGE_NAMESPACE:?Set it to the namespace of Forge's images and fragments, e.g. `docker.io/brnshkr`.}}\
      /${FORGE_APP_IMAGE_NAME:-${FORGE_IMAGE_NAME:-forge}}\
      :${FORGE_TAG:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}-app\
      @${FORGE_APP_IMAGE_DIGEST:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}}"
    command: >-
      ${PHP_APP_COMMAND:-frankenphp run
      --config /etc/frankenphp/Caddyfile}
    working_dir: /app
    mem_limit: ${PHP_APP_CONTAINER_MEMORY_LIMIT:-1g}
    pids_limit: ${PHP_APP_CONTAINER_PIDS_LIMIT:-512}
    env_file:
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.local
        required: false
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.${DEPLOY_APP_ENV:-prod}.local
        required: false
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.deploy.local
        required: false
    environment:
      APP_ENV: ${DEPLOY_APP_ENV:-prod}
      CADDY_EXTRA_CONFIG: ~
      CADDY_GLOBAL_OPTIONS: ~
      CADDY_SERVER_EXTRA_DIRECTIVES: ~
      FORGE_CONTENT_SECURITY_POLICY: ~
      FORGE_CROSS_ORIGIN_OPENER_POLICY: ~
      FORGE_CROSS_ORIGIN_RESOURCE_POLICY: ~
      FORGE_HTTP_REDIRECT: 1
      FORGE_MAX_WAIT_TIME: ~
      FORGE_MERCURE: ~
      FORGE_MERCURE_UPSTREAM: ~
      FORGE_PERMISSIONS_POLICY: ~
      FORGE_READ_BODY_TIMEOUT: ~
      FORGE_STRICT_TRANSPORT_SECURITY: ~
      FORGE_RELEASE: ${FORGE_RELEASE:-}
      FORGE_WORKER: ~
      FORGE_WORKER_CONFIG: ~
      FRANKENPHP_CONFIG: ~
      MERCURE_EXTRA_DIRECTIVES: ~
      MERCURE_PUBLISHER_JWT_ALG: ~
      MERCURE_PUBLISHER_JWT_KEY: ~
      MERCURE_SUBSCRIBER_JWT_ALG: ~
      MERCURE_SUBSCRIBER_JWT_KEY: ~
      MERCURE_TRUSTED_ISSUERS: ~
      SERVER_NAME: ${SERVER_NAME:?Set it to the domain names to serve, e.g. `acme-shop.internal`.}
      SERVER_ROOT: ~
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:2019/metrics') === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 10
    post_start:
      - command:
          - sh
          - -c
          - '[ -n "$${FORGE_ONE_OFF:-}" ] || exec ${FORGE_WARMUP_COMMAND:-true}'

    ports:
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTP_PORT:-${APP_HTTP_PORT:?}}:80
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTPS_PORT:-${APP_HTTPS_PORT:?}}:443
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTPS_PORT:-${APP_HTTPS_PORT:?}}:443/udp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=32m
      - ${FORGE_CACHE_DIR:-/app/var/cache}:rw,nosuid,nodev,size=512m,uid=${RUNTIME_USER_UID:-33},gid=${RUNTIME_USER_GID:-33},mode=0700
    volumes:
      - forge-caddy-config:/config
      - forge-caddy-data:/data
      - forge-var:${FORGE_VAR_DIR:-/app/var}

volumes:
  forge-caddy-config: ~
  forge-caddy-data: ~
  forge-var: ~
