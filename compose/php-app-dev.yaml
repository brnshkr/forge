services:
  php-app:
    extends:
      file: ./base.yaml
      service: base
    restart: no
    image: "${FORGE_APP_DEV_IMAGE:-\
      ${FORGE_IMAGE_NAMESPACE:-\
      ${FORGE_NAMESPACE:?Set it to the namespace of Forge's images and fragments, e.g. `docker.io/brnshkr`.}}\
      /${FORGE_APP_DEV_IMAGE_NAME:-${FORGE_IMAGE_NAME:-forge}}\
      :${FORGE_TAG:?Set `FORGE_TAG` and `FORGE_APP_DEV_IMAGE_DIGEST`, or `FORGE_APP_DEV_IMAGE`.}-app-dev\
      @${FORGE_APP_DEV_IMAGE_DIGEST:?Set `FORGE_TAG` and `FORGE_APP_DEV_IMAGE_DIGEST`, or `FORGE_APP_DEV_IMAGE`.}}"
    command: >-
      ${PHP_APP_COMMAND:-frankenphp run
      --config /etc/frankenphp/Caddyfile}
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    mem_limit: ${PHP_APP_DEV_CONTAINER_MEMORY_LIMIT:-${PHP_APP_CONTAINER_MEMORY_LIMIT:-2g}}
    pids_limit: ${PHP_APP_DEV_CONTAINER_PIDS_LIMIT:-${PHP_APP_CONTAINER_PIDS_LIMIT:-512}}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      BUN_INSTALL_CACHE_DIR: /app/.cache/bun.cache
      CADDY_EXTRA_CONFIG: ~
      CADDY_GLOBAL_OPTIONS: ~
      CADDY_SERVER_EXTRA_DIRECTIVES: ~
      COMPOSER_AUTH: ~
      COMPOSER_CACHE_DIR: /app/.cache/composer.cache
      FORGE_CONTENT_SECURITY_POLICY: ~
      FORGE_CROSS_ORIGIN_OPENER_POLICY: ~
      FORGE_CROSS_ORIGIN_RESOURCE_POLICY: ~
      FORGE_HOT_RELOAD: ~
      FORGE_HTTP_REDIRECT: 1
      FORGE_MAX_WAIT_TIME: ~
      FORGE_MERCURE: ~
      FORGE_MERCURE_UPSTREAM: ~
      FORGE_PERMISSIONS_POLICY: ~
      FORGE_READ_BODY_TIMEOUT: ~
      FORGE_STRICT_TRANSPORT_SECURITY: ~
      FORGE_WORKER: ~
      FORGE_WORKER_CONFIG: ~
      FRANKENPHP_CONFIG: ~
      LANG: ~
      LC_ALL: ~
      MERCURE_EXTRA_DIRECTIVES: ~
      MERCURE_PUBLISHER_JWT_ALG: ~
      MERCURE_PUBLISHER_JWT_KEY: ~
      MERCURE_SUBSCRIBER_JWT_ALG: ~
      MERCURE_SUBSCRIBER_JWT_KEY: ~
      MERCURE_TRUSTED_ISSUERS: ~
      PHP_IDE_CONFIG: ~
      SERVER_NAME: ${SERVER_NAME:?Set it to the domain names to serve, e.g. `acme-shop.internal`.}
      SERVER_ROOT: ~
      TZ: ~
      XDEBUG_CONFIG: ~
      XDEBUG_MODE: ~
      XDG_CACHE_HOME: /app/.cache/xdg.cache
      XDG_CONFIG_HOME: /app/.cache/xdg.cache
      XDG_DATA_HOME: /app/.cache/xdg.cache
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ls -A /app | grep -q . \
            && php -r "exit(@file_get_contents('http://127.0.0.1:2019/metrics') === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTP_PORT:-${APP_HTTP_PORT:?}}:80
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTPS_PORT:-${APP_HTTPS_PORT:?}}:443
      - ${APP_HOST_IP:-127.0.0.1}:${PHP_APP_HTTPS_PORT:-${APP_HTTPS_PORT:?}}:443/udp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=32m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:rw
      - forge-home:/home/forge

volumes:
  forge-home: ~
