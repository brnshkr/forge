services:
  actionlint:
    extends:
      file: ./base.yaml
      service: base
    image: "${ACTIONLINT_IMAGE:-\
      ${ACTIONLINT_REPOSITORY:-rhysd/actionlint}\
      :${ACTIONLINT_TAG:?Set `ACTIONLINT_TAG` and `ACTIONLINT_IMAGE_DIGEST`, or `ACTIONLINT_IMAGE`.}\
      @${ACTIONLINT_IMAGE_DIGEST:?Set `ACTIONLINT_TAG` and `ACTIONLINT_IMAGE_DIGEST`, or `ACTIONLINT_IMAGE`.}}"
    entrypoint: []
    profiles:
      - actionlint
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    mem_limit: ${ACTIONLINT_CONTAINER_MEMORY_LIMIT:-256m}
    pids_limit: ${ACTIONLINT_CONTAINER_PIDS_LIMIT:-256}
    environment:
      HOME: /tmp
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:ro
