services:
  messenger:
    image: ${FORGE_APP_IMAGE:-${FORGE_REPOSITORY_OWNER:?Set it to the namespace of Forge's images, e.g. `ghcr.io/brnshkr`.}/${FORGE_APP_IMAGE_NAME:-forge-app}:${FORGE_TAG:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}${FORGE_APP_IMAGE_SUFFIX:-}@${FORGE_APP_IMAGE_DIGEST:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}}
    command: >-
      bin/console messenger:consume ${MESSENGER_TRANSPORTS:?Set it to the transports to consume, e.g. `async scheduler_default`.}
        --time-limit=${MESSENGER_TIME_LIMIT:-3600}
        --memory-limit=${MESSENGER_MEMORY_LIMIT:-128M}
    working_dir: /app
    restart: unless-stopped
    logging:
      driver: local
    init: true
    read_only: true
    mem_limit: ${MESSENGER_CONTAINER_MEMORY_LIMIT:-512m}
    pids_limit: ${MESSENGER_CONTAINER_PIDS_LIMIT:-512}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${MESSENGER_STOP_GRACE_PERIOD:-60s}
    env_file:
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.local
        required: false
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.${DEPLOY_APP_ENV:-prod}.local
        required: false
      - path: ${FORGE_SHARED_DIR:-/app/var/shared}/.env.deploy.local
        required: false
    environment:
      APP_ENV: ${DEPLOY_APP_ENV:-prod}
      FORGE_RELEASE: ${FORGE_RELEASE:-}
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=32m
      - ${FORGE_CACHE_DIR:-/app/var/cache}:rw,nosuid,nodev,size=512m,uid=${RUNTIME_USER_UID:-33},gid=${RUNTIME_USER_GID:-33},mode=0700
    volumes:
      - forge-var:${FORGE_VAR_DIR:-/app/var}

volumes:
  forge-var: ~
