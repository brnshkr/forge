services:
  app:
    image: ${FORGE_APP_IMAGE:-${FORGE_REPOSITORY_OWNER:?Set it to the namespace of Forge's images, e.g. `ghcr.io/brnshkr`.}/${FORGE_APP_IMAGE_NAME:-forge-bun-app}:${FORGE_TAG:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}${FORGE_APP_IMAGE_SUFFIX:-}@${FORGE_APP_IMAGE_DIGEST:?Set `FORGE_TAG` and `FORGE_APP_IMAGE_DIGEST`, or `FORGE_APP_IMAGE`.}}
    command: ${FORGE_COMMAND:-bun --watch run start}
    working_dir: /app
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    restart: unless-stopped
    logging:
      driver: local
    init: true
    read_only: true
    mem_limit: ${APP_DEV_CONTAINER_MEMORY_LIMIT:-${APP_CONTAINER_MEMORY_LIMIT:-2g}}
    pids_limit: ${APP_DEV_CONTAINER_PIDS_LIMIT:-${APP_CONTAINER_PIDS_LIMIT:-512}}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - host.docker.internal:host-gateway
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      BUN_INSTALL_CACHE_DIR: /app/.cache/bun.cache
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 80
      TZ: ~
      XDG_CACHE_HOME: /app/.cache/xdg.cache
      XDG_CONFIG_HOME: /app/.cache/xdg.cache
      XDG_DATA_HOME: /app/.cache/xdg.cache
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:80/').then((response) =>
          process.exit(response.status >= 500 ? 1 : 0)).catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - ${APP_HOST_IP:-127.0.0.1}:${APP_HTTP_PORT:?}:80
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
      - /run:rw,nosuid,nodev,size=32m
    volumes:
      - ${HOST_APP_DIR:-${PWD}}:/app:rw
      - forge-home:/home/forge

volumes:
  forge-home: ~
