name: Bump

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for every job, defaults to the `RUNNER_IMAGE` variable
        required: false
        type: string

      skip:
        description: JSON array of jobs and groups to skip
        required: false
        type: string
        default: '[]'

      branch:
        description: Branch the bumps are pushed to
        required: false
        type: string
        default: chore/versions

      install-command:
        description: Command that installs the dependencies, defaults to `make` if a Makefile exists
        required: false
        type: string
        default: ''

      bump-command:
        description: >-
          Command that bumps your repository's other pins, like its dependencies,
          printing `pin<TAB>from<TAB>to` for each
        required: false
        type: string
        default: make bump -- --format=tsv

    secrets:
      BOT_CLIENT_ID:
        description: Client ID of the GitHub App the workflows push through
        required: true

      BOT_PRIVATE_KEY:
        description: Private key of the GitHub App the workflows push through
        required: true

permissions:
  contents: read

jobs:
  bump:
    name: Bump Versions
    if: ${{ !contains(fromJSON(inputs.skip), 'bump') }}
    runs-on: ${{ inputs.runner || vars.RUNNER_IMAGE }}
    outputs:
      changes: ${{ steps.changes.outputs.value }}
      commit: ${{ steps.changes.outputs.commit }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Toolchain
        uses: $/.github/actions/setup

      - name: Check Skipped Jobs
        env:
          SKIP: ${{ inputs.skip }}
        run: bun --bun ./.cache/forge.cache/bin/check-skip.ts --skip="$SKIP"

      - name: Prepare Dependencies
        uses: $/.github/actions/prepare
        with:
          install-command: ${{ inputs.install-command }}

      - name: Restore Bump Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.cache/bump.cache.json
          key: bump-seen-${{ github.run_id }}
          restore-keys: bump-seen-

      - name: Resolve Newer Versions
        id: changes
        env:
          COMMAND: ${{ inputs.bump-command }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_RELEASE_AGE: ${{ vars.MINIMUM_RELEASE_AGE }}
        run: |
          image_rows=$(bun --bun ./.cache/forge.cache/bin/bump-images.ts \
            --format=tsv \
            --seen-file=./.cache/bump.cache.json)

          command_rows=$(sh -c "$COMMAND")

          table=$(printf '%s\n%s\n' "$image_rows" "$command_rows" | jq --raw-input --raw-output '
            select(. != "")
            | split("\t")
            | map("\u0060" + (split("|") | join("\\|")) + "\u0060")
            | "| " + join(" | ") + " |"
          ')

          if [ -n "$table" ]; then
            git diff --binary >"$RUNNER_TEMP/bump.patch"
          fi

          {
            echo "commit=$(git rev-parse HEAD)"
            echo 'value<<CHANGES'

            if [ -n "$table" ]; then
              printf '## ⬆️ Pinned versions\n\n| Pin | From | To |\n| --- | --- | --- |\n%s\n' "$table"
            fi

            echo CHANGES
          } >>"$GITHUB_OUTPUT"

      - name: Save Bump Cache
        if: ${{ !cancelled() && hashFiles('.cache/bump.cache.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.cache/bump.cache.json
          key: bump-seen-${{ github.run_id }}

      - name: Upload Changes
        if: ${{ steps.changes.outputs.value != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bump
          path: ${{ runner.temp }}/bump.patch
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open Pull Request
    needs: bump
    if: ${{ needs.bump.outputs.changes != '' }}
    runs-on: ${{ inputs.runner || vars.RUNNER_IMAGE }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.commit }}
          persist-credentials: false

      - name: Setup Toolchain
        uses: $/.github/actions/setup

      - name: Download Changes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bump
          path: ${{ runner.temp }}

      - name: Act As Bot
        id: bot
        uses: $/.github/actions/bot
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open Pull Request
        env:
          BRANCH: ${{ inputs.branch }}
          CHANGES: ${{ needs.bump.outputs.changes }}
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          base=$(git rev-parse HEAD)

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f "sha=$base" -F force=true >/dev/null \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$base" >/dev/null

          git apply --index "$RUNNER_TEMP/bump.patch"

          bun --bun ./.cache/forge.cache/bin/commit-changes.ts \
            --branch="$BRANCH" \
            --message='chore(deps): bump versions' \
            >/dev/null

          if ! gh pr create --fill --head "$BRANCH" --body "$CHANGES"; then
            gh pr edit "$BRANCH" --body "$CHANGES"
          fi
