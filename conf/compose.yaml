name: ${COMPOSE_PROJECT_NAME:?}

include:
  - path: ../compose/node.yaml
  - path: ../compose/semgrep.yaml

services:
  cli:
    extends:
      file: ../compose/cli.yaml
      service: cli
    build:
      context: ..
      dockerfile: ${IMAGE_DOCKERFILE:-./docker/${IMAGE_NAME:?}.Dockerfile}
      target: ${IMAGE_TARGET:?}
      args:
        - DEBIAN_SUITE
        - PHP_MINOR
        - PHP_VERSION
        - PHP_DIGEST
        - PHP_EXTENSION_INSTALLER_VERSION
        - PHP_EXTENSION_INSTALLER_DIGEST
        - FRANKENPHP_VERSION
        - FRANKENPHP_DIGEST
        - COMPOSER_VERSION
        - BUN_VERSION
        - BUN_DIGEST
        - SHELLCHECK_VERSION
        - SHELLCHECK_CHECKSUM
        - HADOLINT_VERSION
        - HADOLINT_CHECKSUM
        - ACTIONLINT_VERSION
        - ACTIONLINT_CHECKSUM
        - CLI_APT_PACKAGES
        - DEV_APT_PACKAGES
        - PHP_EXTENSIONS
        - APP_PHP_EXTENSIONS
        - DEV_PHP_EXTENSIONS
        - IMAGE_NAME
        - IMAGE_DESCRIPTION
        - IMAGE_VENDOR
        - IMAGE_AUTHORS
        - IMAGE_LICENSES
        - IMAGE_URL
        - IMAGE_SOURCE
        - HAS_BUN
        - USER_NAME
        - USER_UID
        - USER_GID
        - RUNTIME_USER_UID
        - RUNTIME_USER_GID
        - EXTRA_APT_PACKAGES
        - EXTRA_PHP_EXTENSIONS
      labels:
        org.opencontainers.image.version: ${IMAGE_VERSION}
        org.opencontainers.image.revision: ${IMAGE_REVISION}
        org.opencontainers.image.created: ${IMAGE_CREATED}

volumes:
  forge-home: ~
