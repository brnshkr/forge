# yaml-language-server: $schema=https://www.schemastore.org/actionlint.json

config-variables:
  - DEPLOY_KNOWN_HOSTS
  - MINIMUM_RELEASE_AGE
  - RUNNER_IMAGE

paths:
  .github/workflows/*.{yaml,yml}:
    ignore:
      - property "workflow_repository" is not defined
      - property "workflow_sha" is not defined
      - reusable workflow call "\$/
      - specifying action "\$/
